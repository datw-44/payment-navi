name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  # GitHubの画面（Actionsタブ）から手動で再実行できるようにする
  workflow_dispatch:

# GitHub Pagesへのデプロイに必要な最小権限のみ付与する
permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイを防ぐ（実行中のデプロイは完了を待つ）
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (static export)
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
